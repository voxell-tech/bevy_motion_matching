[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixon-voxell/bevy_motion_matching"

[workspace.dependencies]
bevy_bvh_anim = { version = "0.1.0", path = "crates/bevy_bvh_anim" }
bevy = { version = "0.17", default-features = false, features = [
	"std",
	"bevy_gilrs",
	"bevy_winit",
	"default_font",
	"multi_threaded",
	"wayland",
	"async_executor",
	"bevy_asset",
	"bevy_input_focus",
	"bevy_log",
	"bevy_state",
	"bevy_window",
	"reflect_auto_register",
	"animation",
	"bevy_camera",
	"bevy_color",
	"bevy_gizmos",
	"bevy_image",
	"bevy_mesh",
	"bevy_shader",
	"bevy_text",
	"hdr",
	"png",
	"bevy_render",
	"bevy_core_pipeline",
	"bevy_anti_alias",
	"bevy_gltf",
	"bevy_pbr",
	"bevy_post_process",
	"bevy_light",
	"bevy_scene",
	"asset_processor"
] }
bevy_egui = "0.38"
bevy-inspector-egui = "0.35"
egui_extras = "0.33"
egui_plot = "0.34"
leafwing-input-manager = "0.19"
serde_json = "1.0"
serde = "1.0"
bvh_anim = "0.4"
thiserror = "1.0"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
bool_comparison = "allow"
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

[package]
name = "bevy_motion_matching"
categories = ["game-engines", "graphics", "gui", "rendering", "multimedia"]
description = "Motion matching system in Bevy."
exclude = ["/assets/", "/.github/", "/examples/"]
keywords = ["motion-matching", "animation", "bevy"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy_bvh_anim = { workspace = true }
bevy = { workspace = true }
bevy_egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

egui_extras = { workspace = true }
egui_plot = { workspace = true }
leafwing-input-manager = { workspace = true }

# Debug editor (run with debug feature to enable it)
bevy-inspector-egui = { workspace = true, optional = true }
kdtree = "0.7.0"
peak_alloc = { git = "https://github.com/Steveplays28/peak_alloc", branch = "fix-usize-overflow" }
clustering = "0.2.1"
csv = "1.3.0"

[dev-dependencies]
bevy-inspector-egui = { workspace = true }

[lints]
workspace = true

[features]
default = ["bevy/file_watcher"]
debug = ["dep:bevy-inspector-egui"]

# Enable a small amount of optimization in debug mode.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in debug mode for dependencies.
[profile.dev.package."*"]
opt-level = 3
